# FairGuard (الحراسة العادلة) — مستودع من ملفين: app.enc (مشفّر وموقَّع) وهذا الملف.
# يبني: (1) FairGuardTools: محرّك الأدوات المحلية (مستقل). (2) FairGuard: التطبيق (إن وُجد app.enc).
name: build-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Write sources
        run: |
          set -euo pipefail
          mkdir -p app tool kit/tools
          echo '' | base64 -d > icon.ico
          cp icon.ico app/icon.ico
          cat > pack.js <<'GUARD_EOF'
          const m = require('@electron/packager');
          const packager = typeof m === 'function' ? m : (m.packager || m.default);
          const [dir, name] = process.argv.slice(2);
          const o = { dir, name, platform: 'win32', arch: 'ia32', electronVersion: '22.3.27', out: 'dist', overwrite: true, asar: true, prune: false };
          if (process.platform === 'win32') o.icon = 'icon.ico';
          packager(o).then(p => console.log('OK', p)).catch(e => { console.error(e); process.exit(1); });
          GUARD_EOF
          cat > app/main.js <<'GUARD_EOF'
          const { app, BrowserWindow, Menu, dialog, shell, clipboard } = require('electron');
          const path = require('path'), fs = require('fs'), crypto = require('crypto');
          const ac = require('./appcrypt'), lic = require('./license'), upd = require('./updater');
          const UPDATE_URL = 'https://kndsabdelkrim-droid.github.io/guard-only/update.json';
          app.setName('FairGuard');
          if (process.platform === 'win32') app.setAppUserModelId('dz.fairguard.app');
          app.setPath('userData', path.join(app.getPath('appData'), 'FairGuard'));
          if (!app.requestSingleInstanceLock()) { app.quit(); }
          const T = 'الحراسة العادلة';
          let tmpFile = '';
          function cleanup() { try { if (tmpFile) fs.unlinkSync(tmpFile); } catch (e) {} tmpFile = ''; }
          function licenseFile() {
            const a = path.join(path.dirname(process.execPath), 'license.json');
            return fs.existsSync(a) ? a : path.join(app.getPath('userData'), 'license.json');
          }
          function writeRequest(id) {
            const txt = 'طلب ترخيص — الحراسة العادلة\nرقم الجهاز: ' + id + '\nاسم المؤسسة: \n';
            for (const d of [path.dirname(process.execPath), app.getPath('userData')]) {
              try { fs.mkdirSync(d, { recursive: true }); fs.writeFileSync(path.join(d, 'license-request.txt'), txt); return d; } catch (e) {}
            }
            return '';
          }
          function fail(msg) { dialog.showErrorBox(T, msg); app.quit(); }
          function create() {
            Menu.setApplicationMenu(null);
            const v = ac.check(__dirname);
            if (!v.ok) return fail(v.msg + '\nأعد تنزيل البرنامج من المصدر الرسمي.');
            const pub = v.pem;
            const L = lic.check(pub, licenseFile());
            if (!L.ok) {
              const id = lic.machineId(), where = writeRequest(id);
              clipboard.writeText(id);
              return fail(L.msg + '\n\nرقم هذا الجهاز (نُسخ إلى الحافظة):\n' + id +
                '\n\nأرسله إلى صاحب البرنامج لتحصل على license.json، وضعه بجانب FairGuard.exe ثم أعد التشغيل.' +
                (where ? '\nتم حفظ طلب الترخيص في: ' + where : ''));
            }
            let html;
            try { html = ac.decrypt(v.pkg, ac.unwrap(L.wk, L.id)); }
            catch (e) { return fail('تعذّر فتح البرنامج بهذا الترخيص. اطلب ترخيصًا جديدًا من صاحب البرنامج.'); }
            tmpFile = path.join(app.getPath('userData'), 'run-' + crypto.randomBytes(6).toString('hex') + '.html');
            try { fs.mkdirSync(path.dirname(tmpFile), { recursive: true }); fs.writeFileSync(tmpFile, html); }
            catch (e) { return fail('تعذّر تجهيز البرنامج: ' + e.message); }
            const w = new BrowserWindow({
              width: 1366, height: 850, show: false, autoHideMenuBar: true, title: T + ' — ' + L.school, icon: path.join(__dirname, 'icon.ico'),
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true }
            });
            w.on('page-title-updated', e => e.preventDefault());
            w.once('ready-to-show', () => { w.maximize(); w.show(); });
            w.webContents.setWindowOpenHandler(() => ({ action: 'deny' }));
            w.webContents.once('did-finish-load', async () => {
              cleanup();
              if (L.days <= 30) dialog.showMessageBox(w, { type: 'warning', title: T, message: 'ينتهي الترخيص بعد ' + L.days + ' يومًا (' + L.expires + '). تواصل مع صاحب البرنامج للتجديد.' });
              const u = await upd.checkUpdate(UPDATE_URL, pub, app.getVersion());
              if (!u) return;
              const r = await dialog.showMessageBox(w, { type: 'info', title: 'تحديث جديد', buttons: ['تنزيل التحديث', 'لاحقًا'], defaultId: 0, cancelId: 1,
                message: 'يتوفر إصدار جديد ' + u.version + ' (الحالي ' + app.getVersion() + ')', detail: u.notes || '' });
              if (r.response === 0) shell.openExternal(u.url);
            });
            w.loadFile(tmpFile);
          }
          app.whenReady().then(create);
          app.on('second-instance', () => { const w = BrowserWindow.getAllWindows()[0]; if (w) { if (w.isMinimized()) w.restore(); w.focus(); } });
          app.on('window-all-closed', () => { cleanup(); app.quit(); });
          app.on('quit', cleanup);
          GUARD_EOF
          cat > app/appcrypt.js <<'GUARD_EOF'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          // app.enc: JSON {v, pub, iv, tag, ct, sig}. التوقيع على v|iv|tag|ct، والتشفير AES-256-GCM
          const wrapKey = id => crypto.createHash('sha256').update('GUARD-WK|' + id).digest();
          function unwrap(wk, id) {
            const b = Buffer.from(wk, 'base64');
            const d = crypto.createDecipheriv('aes-256-gcm', wrapKey(id), b.slice(0, 12));
            d.setAuthTag(b.slice(12, 28));
            return Buffer.concat([d.update(b.slice(28)), d.final()]);
          }
          // يتحقق من توقيع app.enc ويعيد المفتاح العمومي المضمَّن
          function check(dir) {
            try {
              const p = JSON.parse(fs.readFileSync(path.join(path.resolve(dir), 'app.enc'), 'utf8'));
              const pem = Buffer.from(p.pub, 'base64').toString('utf8');
              const ok = crypto.verify(null, Buffer.from([p.v, p.iv, p.tag, p.ct].join('|'), 'utf8'), crypto.createPublicKey(pem), Buffer.from(p.sig, 'base64'));
              return ok ? { ok: true, pem, pkg: p } : { ok: false, msg: 'التوقيع غير مطابق: الملف تغيّر.' };
            } catch (e) { return { ok: false, msg: 'تعذّر التحقق من التوقيع: ' + e.message }; }
          }
          function decrypt(p, K) {
            const d = crypto.createDecipheriv('aes-256-gcm', K, Buffer.from(p.iv, 'base64'));
            d.setAuthTag(Buffer.from(p.tag, 'base64'));
            return Buffer.concat([d.update(Buffer.from(p.ct, 'base64')), d.final()]);
          }
          module.exports = { check, decrypt, unwrap };
          GUARD_EOF
          cat > app/license.js <<'GUARD_EOF'
          const fs = require('fs'), path = require('path'), os = require('os'), crypto = require('crypto');
          // رقم الجهاز: مشتق من بطاقة الشبكة والمعالج، فالرخصة تعمل على الجهاز المرخَّص له فقط
          function machineId() {
            const macs = [];
            Object.values(os.networkInterfaces()).forEach(a => (a || []).forEach(n => {
              if (n && !n.internal && n.mac && n.mac !== '00:00:00:00:00:00') macs.push(n.mac);
            }));
            macs.sort();
            const cpu = (os.cpus()[0] || {}).model || '';
            return crypto.createHash('sha256').update((macs[0] || '') + '|' + cpu + '|' + os.platform())
              .digest('hex').slice(0, 16).toUpperCase().match(/.{4}/g).join('-');
          }
          const payload = l => [l.school, l.id, l.expires, l.wk || ''].join('|');
          // يتحقق من license.json: التوقيع، رقم الجهاز، تاريخ الانتهاء
          function check(pubPem, licPath, now) {
            let l;
            try { l = JSON.parse(fs.readFileSync(licPath, 'utf8')); } catch (e) { return { ok: false, code: 'missing', msg: 'لا يوجد ملف الترخيص license.json.' }; }
            try {
              const pub = crypto.createPublicKey(pubPem);
              if (!crypto.verify(null, Buffer.from(payload(l)), pub, Buffer.from(l.sig || '', 'base64'))) return { ok: false, code: 'bad', msg: 'ملف الترخيص غير صالح.' };
            } catch (e) { return { ok: false, code: 'bad', msg: 'ملف الترخيص غير صالح.' }; }
            if (l.id !== machineId()) return { ok: false, code: 'machine', msg: 'هذا الترخيص خاص بجهاز آخر، ولا يجوز نقل البرنامج أو توزيعه.' };
            const days = Math.ceil((new Date(l.expires + 'T23:59:59') - (now || new Date())) / 864e5);
            if (!(days >= 0)) return { ok: false, code: 'expired', msg: 'انتهت صلاحية الترخيص بتاريخ ' + l.expires + '.' };
            return { ok: true, school: l.school, expires: l.expires, days, id: l.id, wk: l.wk };
          }
          module.exports = { machineId, check, payload };
          GUARD_EOF
          cat > app/updater.js <<'GUARD_EOF'
          const https = require('https'), crypto = require('crypto');
          function fetchJson(url) {
            return new Promise((res, rej) => {
              const r = https.get(url, { timeout: 8000 }, resp => {
                if (resp.statusCode !== 200) { resp.resume(); return rej(new Error('http ' + resp.statusCode)); }
                let b = ''; resp.setEncoding('utf8');
                resp.on('data', d => { b += d; if (b.length > 20000) r.destroy(new Error('big')); });
                resp.on('end', () => { try { res(JSON.parse(b)); } catch (e) { rej(e); } });
              });
              r.on('error', rej); r.on('timeout', () => r.destroy(new Error('timeout')));
            });
          }
          const newer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
            for (let i = 0; i < 4; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; };
          const payload = u => [u.version, u.url, u.notes || ''].join('|');
          // يعيد التحديث فقط إذا كان موقَّعًا وأحدث وبرابط مسموح
          function validate(u, pubPem, current) {
            try {
              if (!u || !u.version || !u.url || !/^https:\/\//.test(String(u.url))) return null;
              if (!crypto.verify(null, Buffer.from(payload(u)), crypto.createPublicKey(pubPem), Buffer.from(u.sig || '', 'base64'))) return null;
              return newer(u.version, current) ? u : null;
            } catch (e) { return null; }
          }
          async function checkUpdate(url, pubPem, current) { try { return validate(await fetchJson(url), pubPem, current); } catch (e) { return null; } }
          module.exports = { checkUpdate, validate, payload, newer };
          GUARD_EOF
          cat > tool/main.js <<'GUARD_EOF'
          require('electron').app.quit();
          GUARD_EOF
          node -e "require('fs').writeFileSync('tool/package.json', JSON.stringify({ name: 'fairguardtools', productName: 'FairGuardTools', version: '1.0.0', main: 'main.js', license: 'UNLICENSED', private: true }, null, 2));"
          cat > kit/tools/make-update.js <<'GUARD_EOF'
          // يقرأ update-request.txt (UTF-8): السطر1 رابط تنزيل الإصدار (https)، السطر2 ملاحظات (اختياري). الإصدار يؤخذ من index.html
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const dir = process.cwd(), K = path.join(dir, 'guard-private.pem');
          if (!fs.existsSync(K)) { console.log('ERREUR: guard-private.pem introuvable.'); process.exit(1); }
          const L = fs.readFileSync(path.join(dir, 'update-request.txt'), 'utf8').replace(/^\uFEFF/, '').split(/\r?\n/).map(x => x.trim());
          const url = L[0], notes = L[1] || '';
          if (!/^https:\/\/\S+$/.test(url || '')) { console.log('ERREUR: ligne 1 de update-request.txt = lien https du telechargement'); process.exit(1); }
          const version = ((fs.readFileSync(path.join(dir, 'index.html'), 'utf8').match(/UIV='([0-9.]+)'/)) || [])[1];
          if (!version) { console.log('ERREUR: version introuvable dans index.html'); process.exit(1); }
          const u = { version, url, notes };
          u.sig = crypto.sign(null, Buffer.from([u.version, u.url, u.notes].join('|'), 'utf8'), crypto.createPrivateKey(fs.readFileSync(K))).toString('base64');
          fs.writeFileSync(path.join(dir, 'update.json'), JSON.stringify(u, null, 2), 'utf8');
          console.log('OK: update.json (version ' + version + ') - publiez-le dans le depot public guard-updates');
          GUARD_EOF
          cat > kit/tools/make-license.js <<'GUARD_EOF'
          // يقرأ license-request.txt (UTF-8): السطر1 اسم المؤسسة، 2 رقم الجهاز، 3 تاريخ الانتهاء YYYY-MM-DD
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const dir = process.cwd(), K = path.join(dir, 'guard-private.pem'), AK = path.join(dir, 'app.key');
          if (!fs.existsSync(K) || !fs.existsSync(AK)) { console.log('ERREUR: guard-private.pem ou app.key introuvable (lancez d abord 1-build-enc.bat).'); process.exit(1); }
          const L = fs.readFileSync(path.join(dir, 'license-request.txt'), 'utf8').replace(/^\uFEFF/, '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
          const [school, id0, expires] = L;
          if (!school || !id0 || !/^\d{4}-\d{2}-\d{2}$/.test(expires || '')) { console.log('ERREUR: license-request.txt doit contenir 3 lignes: nom, numero-appareil, date AAAA-MM-JJ'); process.exit(1); }
          const id = id0.toUpperCase();
          if (!/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(id)) { console.log('ERREUR: numero d appareil invalide: ' + id); process.exit(1); }
          const wrapKey = crypto.createHash('sha256').update('GUARD-WK|' + id).digest();
          const iv = crypto.randomBytes(12), c = crypto.createCipheriv('aes-256-gcm', wrapKey, iv);
          const enc = Buffer.concat([c.update(Buffer.from(fs.readFileSync(AK, 'utf8').trim(), 'hex')), c.final()]);
          const wk = Buffer.concat([iv, c.getAuthTag(), enc]).toString('base64');
          const l = { school, id, expires, wk };
          l.sig = crypto.sign(null, Buffer.from([l.school, l.id, l.expires, l.wk].join('|'), 'utf8'), crypto.createPrivateKey(fs.readFileSync(K))).toString('base64');
          fs.mkdirSync(path.join(dir, 'licenses'), { recursive: true });
          fs.writeFileSync(path.join(dir, 'licenses', id + '.license.json'), JSON.stringify(l, null, 2), 'utf8');
          console.log('OK: licenses\\' + id + '.license.json  (renommez-le license.json chez l etablissement)');
          GUARD_EOF
          cat > kit/tools/pack-app.js <<'GUARD_EOF'
          // يشفّر index.html إلى app.enc ويوقّعه. يُشغَّل على جهازك فقط. app.key و guard-private.pem سريّان.
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const dir = process.cwd(), F = path.join(dir, 'index.html'), K = path.join(dir, 'guard-private.pem'), AK = path.join(dir, 'app.key');
          if (!fs.existsSync(F)) { console.log('ERREUR: index.html introuvable dans ce dossier.'); process.exit(1); }
          if (!fs.existsSync(K)) {
            fs.writeFileSync(K, crypto.generateKeyPairSync('ed25519').privateKey.export({ type: 'pkcs8', format: 'pem' }));
            console.log('Nouvelle cle de signature creee: guard-private.pem (SECRETE)');
          }
          if (!fs.existsSync(AK)) { fs.writeFileSync(AK, crypto.randomBytes(32).toString('hex')); console.log('Nouvelle cle de chiffrement creee: app.key (SECRETE)'); }
          const priv = crypto.createPrivateKey(fs.readFileSync(K));
          const pubPem = crypto.createPublicKey(priv).export({ type: 'spki', format: 'pem' });
          const html = fs.readFileSync(F);
          const v = ((html.toString('utf8').match(/UIV='([0-9.]+)'/)) || [])[1];
          if (!v) { console.log('ERREUR: version UIV introuvable dans index.html'); process.exit(1); }
          const key = Buffer.from(fs.readFileSync(AK, 'utf8').trim(), 'hex');
          const iv = crypto.randomBytes(12), c = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ct = Buffer.concat([c.update(html), c.final()]), tag = c.getAuthTag();
          const p = { v, pub: Buffer.from(pubPem, 'utf8').toString('base64'), iv: iv.toString('base64'), tag: tag.toString('base64'), ct: ct.toString('base64') };
          p.sig = crypto.sign(null, Buffer.from([p.v, p.iv, p.tag, p.ct].join('|'), 'utf8'), priv).toString('base64');
          fs.writeFileSync(path.join(dir, 'app.enc'), JSON.stringify(p), 'utf8');
          console.log('OK: app.enc cree (version ' + v + ', ' + Math.round(fs.statSync(path.join(dir, 'app.enc')).size / 1024) + ' Ko). Publiez app.enc seulement.');
          GUARD_EOF
          cat > kit/1-build-enc.bat <<'GUARD_EOF'
          @echo off
          cd /d "%~dp0"
          set ELECTRON_RUN_AS_NODE=1
          set RUN=
          if exist "%~dp0..\FairGuardTools.exe" for %%I in ("%~dp0..\FairGuardTools.exe") do set RUN=%%~sI
          if defined RUN goto go
          echo ERREUR: FairGuardTools.exe introuvable. Le dossier kit doit rester a l interieur du dossier FairGuardTools.
          pause
          exit /b
          :go
          "%RUN%" "%~sdp0tools\pack-app.js" > result.txt 2>&1
          type result.txt
          echo.
          pause
          GUARD_EOF
          cat > kit/2-license.bat <<'GUARD_EOF'
          @echo off
          cd /d "%~dp0"
          set ELECTRON_RUN_AS_NODE=1
          set RUN=
          if exist "%~dp0..\FairGuardTools.exe" for %%I in ("%~dp0..\FairGuardTools.exe") do set RUN=%%~sI
          if defined RUN goto go
          echo ERREUR: FairGuardTools.exe introuvable. Le dossier kit doit rester a l interieur du dossier FairGuardTools.
          pause
          exit /b
          :go
          if not exist license-request.txt (echo Creez license-request.txt: ligne1 nom, ligne2 numero appareil, ligne3 date AAAA-MM-JJ ^(UTF-8^) & pause & exit /b)
          "%RUN%" "%~sdp0tools\make-license.js" > result.txt 2>&1
          type result.txt
          echo.
          pause
          GUARD_EOF
          cat > kit/3-update.bat <<'GUARD_EOF'
          @echo off
          cd /d "%~dp0"
          set ELECTRON_RUN_AS_NODE=1
          set RUN=
          if exist "%~dp0..\FairGuardTools.exe" for %%I in ("%~dp0..\FairGuardTools.exe") do set RUN=%%~sI
          if defined RUN goto go
          echo ERREUR: FairGuardTools.exe introuvable. Le dossier kit doit rester a l interieur du dossier FairGuardTools.
          pause
          exit /b
          :go
          if not exist update-request.txt (echo Creez update-request.txt: ligne1 lien https, ligne2 notes ^(UTF-8^) & pause & exit /b)
          "%RUN%" "%~sdp0tools\make-update.js" > result.txt 2>&1
          type result.txt
          echo.
          pause
          GUARD_EOF
          cat > kit/README-LOCAL.txt <<'GUARD_EOF'
          أدوات FairGuard المحلية — تبقى على جهازك ولا تُرفع إلى GitHub أبدًا.
          هذا المجلد (kit) يجب أن يبقى داخل مجلد FairGuardTools بجانب FairGuardTools.exe (محرّكه، مستقل عن أي تطبيق آخر).
          ضع هنا index.html (النسخة الكاملة غير المشفّرة). الملفان السريّان guard-private.pem و app.key يُنشآن تلقائيًا أول مرة.
          انقر نقرتين على:
            1-build-enc.bat : يشفّر index.html إلى app.enc ويوقّعه (بعد كل تعديل). app.enc هو الوحيد الذي يُرفع.
            2-license.bat   : يصدر ترخيصًا من license-request.txt (انظر license-request.txt.example) إلى مجلد licenses
            3-update.bat    : يصدر update.json من update-request.txt (انظر المثال)
          النتيجة تُكتب في result.txt.
          مهم جدًا: انسخ guard-private.pem و app.key احتياطيًا في مكان آمن (فلاشة أخرى). بدونهما لا تستطيع إصدار تراخيص ولا تحديثات، وإن ضاع app.key فلن تعمل التراخيص القديمة مع النسخ الجديدة.
          لا ترفع إلى GitHub: index.html ولا guard-private.pem ولا app.key ولا مجلد licenses.
          GUARD_EOF
          cat > kit/license-request.txt.example <<'GUARD_EOF'
          اسم المؤسسة
          1234-ABCD-5678-EF90
          2027-08-31
          GUARD_EOF
          cat > kit/update-request.txt.example <<'GUARD_EOF'
          https://رابط-التنزيل-https
          ما الجديد في هذا الإصدار
          GUARD_EOF
          sed -i 's/$/\r/' kit/*.bat kit/*.txt kit/*.example
      - name: Install packager
        run: npm install --no-save --no-package-lock @electron/packager@18.3.6
      - name: Build tools engine
        run: |
          node pack.js tool FairGuardTools
          mkdir -p stage-tools
          mv dist/FairGuardTools-win32-ia32 stage-tools/FairGuardTools
          cp -r kit stage-tools/FairGuardTools/kit
      - uses: actions/upload-artifact@v4
        with:
          name: FairGuardTools-Windows
          path: stage-tools
          if-no-files-found: error
          retention-days: 30
      - name: Prepare app (only if app.enc exists)
        if: ${{ hashFiles('app.enc') != '' }}
        run: |
          cp app.enc app/app.enc
          node -e "const fs = require('fs'); const v = JSON.parse(fs.readFileSync('app.enc', 'utf8')).v; if (!/^[0-9][0-9.]*$/.test(v)) { console.error('ERROR: bad version in app.enc'); process.exit(1); } fs.writeFileSync('app/package.json', JSON.stringify({ name: 'fairguard', productName: 'FairGuard', version: v, description: 'FairGuard', main: 'main.js', author: 'FairGuard', license: 'UNLICENSED', private: true }, null, 2)); console.log('Version: ' + v);"
          node -e "const r=require('./app/appcrypt').check('app'); if(!r.ok){console.error('FAILED: '+r.msg); process.exit(1)} console.log('signature OK')"
      - name: Build app
        if: ${{ hashFiles('app.enc') != '' }}
        run: |
          node pack.js app FairGuard
          mkdir -p stage-app
          mv dist/FairGuard-win32-ia32 stage-app/FairGuard
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app.enc') != '' }}
        with:
          name: FairGuard-Windows
          path: stage-app
          if-no-files-found: error
          retention-days: 30
